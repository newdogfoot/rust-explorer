[package]
name = "rust-explorer"
version = "0.7.1"
edition = "2024"
default-run = "rust-explorer"
description = "A responsive Windows-style file explorer for macOS, written in Rust"
license = "MIT"

[features]
native-ui-tests = []

[dependencies]
crossbeam-channel = "0.5"
notify = "8.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
libc = "0.2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["objc2-uniform-type-identifiers"] }
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-quick-look-ui = "0.3.2"
objc2-quick-look-thumbnailing = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "rust-explorer"
path = "src/main.rs"

[[bin]]
name = "explorer-bench"
path = "src/bin/bench.rs"

[[test]]
name = "native_selection"
path = "tests/native_selection.rs"
harness = false
required-features = ["native-ui-tests"]

[[test]]
name = "native_themes"
path = "tests/native_themes.rs"
harness = false
required-features = ["native-ui-tests"]

[workspace]
resolver = "3"
exclude = [".tools/signing-source"]
